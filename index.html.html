<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(가상) 행정정보 통합관리 기본법</title>
  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>(가상) 행정정보 통합관리 기본법</h1>
      <p class="subtitle">[시행 2026. 7. 1.] [법률 제99999호]</p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="조항, 제목, 본문 키워드 검색 (예: 공동활용, 과태료)..." />
      </div>
      
      <div class="result-count" id="resultCount">
        결과 계산 중...
      </div>
    </header>

    <main id="articlesContainer" class="articles-grid">
      <!-- 조항 카드가 자바스크립트로 출력됩니다 -->
    </main>
  </div>

  <!-- JS 파일 연결 -->
  <script src="app.js"></script>
</body>
</html>
